name: Update Impeccable

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-update:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Update Impeccable
        run: npx --yes impeccable@latest update

      - name: Create constrained update patch
        id: patch
        shell: bash
        run: |
          unexpected_changes="$(git status --short -- . \
            ':(exclude).agents/skills/impeccable/**' \
            ':(exclude).claude/skills/impeccable/**' \
            ':(exclude).codex/hooks.json')"

          if [[ -n "$unexpected_changes" ]]; then
            echo "Impeccable updated files outside the approved paths:" >&2
            echo "$unexpected_changes" >&2
            exit 1
          fi

          git add -A -- \
            .agents/skills/impeccable \
            .claude/skills/impeccable \
            .codex/hooks.json

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary > /tmp/impeccable.patch
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload update patch
        if: steps.patch.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impeccable-update
          path: /tmp/impeccable.patch
          if-no-files-found: error
          retention-days: 1

  open-pull-request:
    needs: prepare-update
    if: needs.prepare-update.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download update patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impeccable-update
          path: /tmp/impeccable-update

      - name: Apply update patch
        run: git apply --index /tmp/impeccable-update/impeccable.patch

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/update-impeccable
          delete-branch: true
          commit-message: "deps: update impeccable"
          title: "deps: update impeccable"
          body: "Automated monthly update generated by `npx impeccable@latest update`."
          assignees: jasonhaak
          sign-commits: true
          add-paths: |
            .agents/skills/impeccable/**
            .claude/skills/impeccable/**
            .codex/hooks.json

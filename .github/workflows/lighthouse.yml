name: Lighthouse

# A reporting indicator, not a gate. It builds the site, runs Lighthouse
# against the built output in ./dist and surfaces the scores in the run summary
# plus the HTML reports as a downloadable artifact. Audit results never fail the
# build; only an infrastructure problem (a broken build or Lighthouse itself)
# turns it red. Configuration lives in .lighthouserc.cjs.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Summarise results
        run: node tools/qa/lhci-summary.mjs

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: error
          retention-days: 14

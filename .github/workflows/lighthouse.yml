name: Lighthouse

# A reporting indicator, not a gate. It builds the site, runs Lighthouse
# against the built output in ./dist and surfaces the scores in the run summary
# plus the HTML reports as a downloadable artifact. Audit results never fail the
# build; only an infrastructure problem (a broken build or Lighthouse itself)
# turns it red. Configuration lives in .lighthouserc.cjs.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Summarise results
        run: node tools/qa/lhci-summary.mjs

      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: error
          retention-days: 14
